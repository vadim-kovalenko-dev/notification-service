<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WireGuard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #111318;
            --bg-1: #0d0f14;
            --surface-0: #161A20;
            --surface-1: #1C2128;
            --surface-2: #222830;
            --border: rgba(255,255,255,0.10);
            --border-hover: rgba(255,255,255,0.18);
            --fg: #e8eaed;
            --fg-muted: #9ca3af;
            --fg-dim: #5f6570;
            --primary: #74C9A0;
            --primary-bg: rgba(116,201,160,0.12);
            --green: #74C9A0;
            --green-bg: rgba(116,201,160,0.15);
            --green-border: rgba(116,201,160,0.3);
            --blue: #5B9BD5;
            --blue-bg: rgba(91,155,213,0.15);
            --blue-border: rgba(91,155,213,0.3);
            --amber: #E3AA5B;
            --amber-bg: rgba(227,170,91,0.15);
            --amber-border: rgba(227,170,91,0.3);
            --red: #E27C87;
            --red-bg: rgba(226,124,135,0.15);
            --red-border: rgba(226,124,135,0.3);
            --violet: #A78BFA;
            --violet-bg: rgba(167,139,250,0.15);
            --violet-border: rgba(167,139,250,0.3);
            --radius-sm: 10px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --radius-pill: 999px;
            --shadow: 0 4px 24px rgba(0,0,0,0.3);
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.2);
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--fg);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }
        .hidden { display: none !important; }

        /* Login */
        .login-page { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .login-card { background: var(--surface-0); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 48px 36px; width: 100%; max-width: 340px; text-align: center; box-shadow: var(--shadow); }
        .login-card h1 { font-family: 'Unbounded', sans-serif; font-size: 22px; font-weight: 600; margin-bottom: 6px; letter-spacing: -0.01em; color: var(--fg); }
        .login-card .login-icon { font-size: 48px; color: var(--primary); margin-bottom: 12px; }
        .login-card p { font-size: 13px; color: var(--fg-muted); margin-bottom: 28px; }
        .login-card input { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface-1); color: var(--fg); font-size: 14px; font-family: inherit; outline: none; margin-bottom: 14px; transition: border-color 0.15s, box-shadow 0.15s; }
        .login-card input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--green-bg); }
        .login-card input::placeholder { color: var(--fg-dim); }
        .login-card button { width: 100%; padding: 10px; border: none; border-radius: var(--radius-sm); background: var(--primary); color: var(--bg); font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; transition: opacity 0.15s, transform 0.15s; }
        .login-card button:hover { opacity: 0.9; }
        .login-card button:active { transform: scale(0.98); }

        /* Topbar */
        .topbar {
            height: 56px; background: var(--bg-1); border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; gap: 12px;
        }
        .topbar-title { font-family: 'Unbounded', sans-serif; font-size: 20px; font-weight: 600; color: var(--fg); white-space: nowrap; }
        .topbar-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

        /* Buttons */
        .btn {
            padding: 7px 14px; border-radius: var(--radius-sm); font-size: 13px;
            font-weight: 500; cursor: pointer; font-family: inherit; transition: all 0.15s;
            line-height: 20px; border: 1px solid transparent; display: inline-flex;
            align-items: center; gap: 6px; white-space: nowrap;
        }
        .btn:active { transform: scale(0.97); }
        .btn .ti { font-size: 16px; }
        .btn-primary { background: var(--primary); color: var(--bg); border-color: var(--primary); }
        .btn-primary:hover { opacity: 0.85; }
        .btn-outline {
            background: var(--surface-0); color: var(--fg-muted); border-color: var(--border);
        }
        .btn-outline:hover { background: var(--surface-1); color: var(--fg); }
        .btn-ghost { background: transparent; color: var(--fg-muted); }
        .btn-ghost:hover { background: var(--surface-1); color: var(--fg); }
        .btn-danger { background: var(--red-bg); color: var(--red); border-color: var(--red-border); }
        .btn-danger:hover { opacity: 0.85; }

        /* Content */
        .content-wrapper { min-height: 100vh; display: flex; flex-direction: column; max-width: 1200px; margin: 0 auto; width: 100%; }
        .content-body { flex: 1; padding: 20px; }
        .main { }

        /* Layout header for tpl-page */
        .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }

        /* Stat cards */
        .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
        .stat-card {
            background: var(--surface-0); border: 1px solid var(--border); border-radius: var(--radius-lg);
            padding: 14px 14px; cursor: pointer; user-select: none;
            transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
            display: flex; flex-direction: column; gap: 8px;
        }
        .stat-card:hover { border-color: var(--border-hover); box-shadow: var(--shadow-sm); }
        .stat-card.active { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
        .stat-card .stat-row { display: flex; align-items: center; gap: 6px; }
        .stat-card .stat-icon { font-size: 20px; color: var(--fg-dim); flex-shrink: 0; }
        .stat-card .stat-label { font-size: 13px; color: var(--fg-muted); font-weight: 500; }
        .stat-card .stat-value { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; font-family: 'Unbounded', sans-serif; }

        /* Table */
        .table-card { background: var(--surface-0); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
        .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: collapse; }
        thead th {
            padding: 11px 12px; font-size: 11px; color: var(--fg-dim); font-weight: 500;
            text-align: left; background: var(--surface-1); border-bottom: 1px solid var(--border);
            text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap;
            position: sticky; top: 0; z-index: 1;
        }
        tbody td {
            padding: 10px 12px; border-bottom: 1px solid var(--border);
            font-size: 13px; vertical-align: middle; height: 48px;
            transition: background 0.1s ease;
        }
        tbody tr:last-child td { border-bottom: none; }
        tbody tr:hover td { background: var(--surface-1); }
        .empty-row td { text-align: center; color: var(--fg-muted); padding: 40px 12px; height: auto; }

        /* Fade */
        .fade-target { transition: opacity 0.12s ease; }
        .fade-target.fade-out { opacity: 0.3; }

        /* User cell */
        .user-cell { display: flex; align-items: center; gap: 10px; overflow: hidden; }
        .avatar {
            width: 32px; height: 32px; border-radius: var(--radius-sm);
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 600; flex-shrink: 0;
            background: var(--surface-2); color: var(--fg-muted);
        }
        .user-info { overflow: hidden; min-width: 0; }
        .user-name { font-weight: 500; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .user-id { font-size: 11px; color: var(--fg-dim); font-family: 'JetBrains Mono', monospace; }

        /* Badges */
        .badge {
            display: inline-flex; align-items: center; padding: 3px 10px;
            border-radius: var(--radius-pill); font-size: 11px; font-weight: 500;
            white-space: nowrap; line-height: 1.5; border: 1px solid transparent;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
        }
        .badge-active { background: var(--green-bg); color: var(--green); border-color: var(--green-border); }
        .badge-expiring { background: var(--amber-bg); color: var(--amber); border-color: var(--amber-border); }
        .badge-expired { background: var(--red-bg); color: var(--red); border-color: var(--red-border); }
        .badge-noaccess { background: var(--violet-bg); color: var(--violet); border-color: var(--violet-border); }
        .badge-paid { background: var(--green-bg); color: var(--green); border-color: var(--green-border); cursor: pointer; }
        .badge-paid:hover { background: rgba(116,201,160,0.25); }
        .badge-free { background: var(--blue-bg); color: var(--blue); border-color: var(--blue-border); cursor: pointer; }
        .badge-free:hover { background: rgba(91,155,213,0.25); }

        /* Inputs */
        .name-input {
            border: 1px solid transparent; background: transparent; font-size: 13px;
            font-family: inherit; color: var(--fg-muted); padding: 4px 6px;
            border-radius: 6px; width: 100%; outline: none; transition: all 0.15s;
        }
        .name-input:hover { background: var(--surface-2); }
        .name-input:focus { background: var(--surface-1); color: var(--fg); border-color: var(--border); box-shadow: 0 0 0 2px var(--green-bg); }
        .name-input::placeholder { color: var(--fg-dim); }

        .date-btn {
            cursor: pointer; padding: 4px 10px; border-radius: 6px; font-size: 12px;
            transition: all 0.15s; border: 1px solid var(--border);
            background: var(--surface-1); font-family: inherit; color: var(--fg-muted); white-space: nowrap;
        }
        .date-btn:hover { background: var(--surface-2); border-color: var(--border-hover); }
        .date-btn.empty { color: var(--fg-dim); border-color: transparent; }

        .icon-btn {
            width: 30px; height: 30px; border: 1px solid transparent; border-radius: var(--radius-sm);
            display: flex; align-items: center; justify-content: center;
            background: transparent; color: var(--fg-dim); cursor: pointer; flex-shrink: 0;
            transition: all 0.15s;
        }
        .icon-btn:hover { background: var(--surface-2); color: var(--fg); }
        .icon-btn .ti { font-size: 16px; }

        /* Pagination */
        .pager {
            display: flex; align-items: center; justify-content: center;
            gap: 4px; padding: 10px 12px;
            border-top: 1px solid var(--border); background: var(--surface-0);
        }
        .pager button {
            min-width: 30px; height: 30px; border-radius: var(--radius-sm);
            border: 1px solid var(--border); background: var(--surface-0);
            color: var(--fg-muted); font-size: 13px; font-weight: 500;
            cursor: pointer; font-family: inherit; transition: all 0.15s;
            display: flex; align-items: center; justify-content: center; padding: 0 6px;
        }
        .pager button:hover:not(.active):not(:disabled) { border-color: var(--border-hover); color: var(--fg); background: var(--surface-1); }
        .pager button.active { background: var(--primary); color: var(--bg); border-color: var(--primary); }
        .pager button:disabled { opacity: 0.3; cursor: default; }
        .pager .pg-info { font-size: 12px; color: var(--fg-dim); margin: 0 4px; white-space: nowrap; }

        /* Date picker */
        .dp-pop { position: fixed; z-index: 200; background: var(--surface-0); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px; width: 280px; display: none; box-shadow: var(--shadow); }
        .dp-pop.on { display: block; }
        .dp-row { display: flex; gap: 8px; margin-bottom: 12px; }
        .dp-row select {
            flex: 1; padding: 8px 6px; border: 1px solid var(--border); border-radius: var(--radius-sm);
            background: var(--surface-1); font-size: 13px; font-family: inherit; color: var(--fg);
            outline: none; appearance: none; text-align: center; cursor: pointer;
            transition: border-color 0.15s;
        }
        .dp-row select:focus { border-color: var(--primary); }
        .dp-row select option { background: var(--surface-1); color: var(--fg); }
        .dp-acts { display: flex; gap: 6px; justify-content: flex-end; }
        .dp-acts button { padding: 7px 14px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 500; cursor: pointer; font-family: inherit; border: 1px solid transparent; transition: all 0.15s; }
        .dp-cancel { background: var(--surface-1); color: var(--fg-muted); border-color: var(--border) !important; }
        .dp-cancel:hover { background: var(--surface-2); }
        .dp-ok { background: var(--primary); color: var(--bg) !important; }
        .dp-ok:hover { opacity: 0.85; }
        .dp-clear { background: transparent !important; color: var(--red) !important; margin-right: auto; }
        .dp-clear:hover { background: var(--red-bg); }

        /* Template page */
        .tpl-page { max-width: 640px; margin: 0 auto; padding: 24px 20px 60px; }
        .tpl-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 24px; }
        .tpl-header h2 { font-family: 'Unbounded', sans-serif; font-size: 20px; font-weight: 600; margin-bottom: 4px; color: var(--fg); }
        .tpl-sub { font-size: 13px; color: var(--fg-muted); }
        .tpl-nav { display: flex; gap: 8px; flex-wrap: wrap; }
        .tpl-grid { display: flex; flex-direction: column; gap: 20px; }
        .tpl-card { background: var(--surface-0); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px; }
        .tpl-card-name { display: block; font-size: 13px; font-weight: 500; margin-bottom: 10px; color: var(--fg); }
        .tpl-card textarea {
            width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm);
            background: var(--surface-1); color: var(--fg); font-size: 13px;
            font-family: 'JetBrains Mono', monospace; outline: none;
            min-height: 120px; resize: vertical; line-height: 1.6;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .tpl-card textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 2px var(--green-bg); }
        .tpl-card textarea::placeholder { color: var(--fg-dim); font-family: 'Inter', sans-serif; }

        /* Toggle */
        .toggle-wrap {
            display: flex; align-items: center; gap: 8px; padding: 7px 12px;
            border-radius: var(--radius-sm); border: 1px solid var(--border);
            background: var(--surface-0); cursor: pointer; transition: all 0.15s; user-select: none;
        }
        .toggle-wrap:hover { border-color: var(--border-hover); }
        .toggle-label { font-size: 12px; font-weight: 500; color: var(--fg-muted); }
        .toggle-wrap.on { border-color: var(--green-border); background: var(--green-bg); }
        .toggle-wrap.on .toggle-label { color: var(--green); }

        /* Toast */
        .toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            padding: 10px 20px; border-radius: var(--radius-sm); font-size: 13px;
            font-weight: 500; z-index: 300; pointer-events: none;
            box-shadow: var(--shadow); border: 1px solid var(--border);
            animation: toastIn 0.2s ease;
        }
        @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(10px); } }
        .toast.ok { background: var(--surface-0); color: var(--fg); }
        .toast.err { background: var(--red); color: #fff; border-color: var(--red); }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }

        /* Desktop: transparent topbar */
        @media (min-width: 641px) {
            .topbar { background: transparent; border-bottom: none; height: auto; min-height: 48px; padding-top: 24px; }
        }

        /* ====== Mobile ====== */
        @media (max-width: 640px) {
            .content-wrapper { max-width: 100%; }
            .content-body { padding: 14px 10px 40px; }
            .topbar { padding: 16px 10px 0; flex-wrap: wrap; height: auto; min-height: 48px; gap: 8px; padding-bottom: 8px; }
            .topbar-title { font-size: 18px; }
            .topbar-actions { width: 100%; flex-wrap: wrap; justify-content: flex-end; }
            .btn { padding: 5px 10px; font-size: 11px; }
            .cards { grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; }
            .stat-card { padding: 10px 12px; }
            .stat-card .stat-label { font-size: 10px; }
            .stat-card .stat-value { font-size: 22px; }

            .table-card { border-radius: var(--radius-md); }
            .table-scroll { overflow-x: auto; }
            table { table-layout: fixed; width: 100%; min-width: 920px; border-collapse: collapse; }
            colgroup col:nth-child(1) { width: 16% !important; }
            colgroup col:nth-child(2) { width: 12% !important; }
            colgroup col:nth-child(3) { width: 11% !important; }
            colgroup col:nth-child(4) { width: 5% !important; }
            colgroup col:nth-child(5) { width: 17% !important; }
            colgroup col:nth-child(6) { width: 14% !important; }
            colgroup col:nth-child(7) { width: 0 !important; display: none; }
            colgroup col:nth-child(8) { width: 13% !important; }
            colgroup col:nth-child(9) { width: 9% !important; }
            colgroup col:nth-child(10) { width: 3% !important; }
            thead th { padding: 10px 8px; font-size: 11px; white-space: nowrap; }
            tbody td { padding: 10px 8px; font-size: 11px; white-space: nowrap; }
            thead th:nth-child(7) { display: none; }
            tbody td:nth-child(7) { display: none; }
            .user-cell { min-width: 0; gap: 8px; }
            .avatar { width: 28px; height: 28px; font-size: 10px; flex-shrink: 0; }
            .user-name { font-size: 11px; }
            .user-id { font-size: 10px; }
            .badge { font-size: 11px; padding: 2px 8px; }
            .date-btn { font-size: 11px; padding: 2px 6px; }
            .icon-btn { width: 26px; height: 26px; }
            .icon-btn .ti { font-size: 14px; }
            .name-input { font-size: 11px; padding: 2px 4px; }

            .pager { padding: 8px; gap: 3px; }
            .pager button { min-width: 26px; height: 26px; font-size: 11px; padding: 0 5px; }
            .pager .pg-info { font-size: 10px; margin: 0 2px; }

            .dp-pop { width: 240px; padding: 12px; }
            .tpl-page { padding: 16px 12px 40px; }
            .tpl-page h2 { font-size: 18px; margin-bottom: 4px; }
            .tpl-sub { font-size: 12px; }
            .tpl-card { padding: 12px; }
            .tpl-card-name { font-size: 12px; margin-bottom: 6px; }
            .tpl-card textarea { min-height: 90px; font-size: 12px; padding: 8px 10px; }
        }
    </style>
</head>
<body>

<div class="login-page" id="lp">
    <div class="login-card">
        <div class="login-icon"><i class="ti ti-shield-check"></i></div>
        <h1>WireGuard</h1>
        <p>Панель управления</p>
        <input type="password" id="lpw" placeholder="Пароль" onkeydown="if(event.key==='Enter')login()">
        <button onclick="login()">Войти</button>
    </div>
</div>

<div class="content-wrapper">
    <div class="topbar" id="topbar">
        <div class="topbar-title" id="topTitle">Пользователи</div>
        <div class="topbar-actions" id="topActions">
            <div class="toggle-wrap" id="autoToggle" onclick="toggleAuto()">
                <span class="toggle-label" id="autoLabel">Автоотправка: ВЫКЛ</span>
            </div>
            <button class="btn btn-outline" onclick="showTpl()"><i class="ti ti-file-text"></i> Шаблоны</button>
            <button class="btn btn-outline" onclick="sendBroadcast()"><i class="ti ti-mail"></i> Рассылка</button>
            <button class="btn btn-outline" onclick="notifyAll()"><i class="ti ti-bell"></i> Уведомить просроченных</button>
            <button class="btn btn-ghost" onclick="logout()"><i class="ti ti-logout"></i></button>
        </div>
    </div>

    <div class="content-body">
        <div class="main" id="app">
            <div class="cards">
                <div class="stat-card active" id="cAll" onclick="filt('all')">
                    <div class="stat-row"><i class="ti ti-users stat-icon"></i><span class="stat-label">Всего</span></div><div class="stat-value" id="sT">-</div>
                </div>
                <div class="stat-card" id="cPaid" onclick="filt('paid')">
                    <div class="stat-row"><i class="ti ti-credit-card stat-icon"></i><span class="stat-label">Платные</span></div><div class="stat-value" id="sP">-</div>
                </div>
                <div class="stat-card" id="cFree" onclick="filt('free')">
                    <div class="stat-row"><i class="ti ti-gift stat-icon"></i><span class="stat-label">Бесплатные</span></div><div class="stat-value" id="sF">-</div>
                </div>
                <div class="stat-card" id="cNoAccess" onclick="filt('noaccess')">
                    <div class="stat-row"><i class="ti ti-lock stat-icon"></i><span class="stat-label">Без доступа</span></div><div class="stat-value" id="sNA">-</div>
                </div>
            </div>

            <div class="table-card">
                <div class="table-scroll">
                    <table>
                        <colgroup>
                            <col style="width:16%"><col style="width:11%"><col style="width:9%"><col style="width:5%">
                            <col style="width:12%"><col style="width:12%"><col style="width:9%"><col style="width:11%">
                            <col style="width:9%"><col style="width:6%">
                        </colgroup>
                        <thead><tr>
                            <th>Пользователь</th><th>Имя</th><th>Тип</th><th>Устр.</th>
                            <th>Трафик</th><th>Активность</th><th>Регистрация</th><th>Оплата до</th><th>Статус</th><th></th>
                        </tr></thead>
                        <tbody id="tb" class="fade-target"></tbody>
                    </table>
                </div>
                <div class="pager" id="pager"></div>
            </div>
        </div>

        <div class="tpl-page hidden" id="tp">
            <div class="tpl-header">
                <div>
                    <h2>Шаблоны</h2>
                    <div class="tpl-sub">Тексты сообщений</div>
                </div>
                <div class="tpl-nav">
                    <button class="btn btn-ghost" onclick="showMain()"><i class="ti ti-arrow-left"></i> Назад</button>
                    <button class="btn btn-primary" onclick="saveTpl()"><i class="ti ti-check"></i> Сохранить</button>
                </div>
            </div>
            <div class="tpl-grid">
                <div class="tpl-card">
                    <span class="tpl-card-name"><i class="ti ti-book"></i>&ensp;Инструкция по подключению</span>
                    <textarea id="tInst" placeholder="Текст инструкции..."></textarea>
                </div>
                <div class="tpl-card">
                    <span class="tpl-card-name"><i class="ti ti-credit-card"></i>&ensp;Уведомление об оплате</span>
                    <textarea id="tPay" placeholder="Текст уведомления..."></textarea>
                </div>
                <div class="tpl-card">
                    <span class="tpl-card-name"><i class="ti ti-clock"></i>&ensp;Напоминание за 3 дня</span>
                    <textarea id="tExpRem" placeholder="Текст напоминания..."></textarea>
                </div>
                <div class="tpl-card">
                    <span class="tpl-card-name"><i class="ti ti-mail"></i>&ensp;Рассылка</span>
                    <textarea id="tBc" placeholder="Текст рассылки..."></textarea>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="dp-pop" id="dp">
    <div class="dp-row">
        <select id="dpD"></select>
        <select id="dpM"></select>
        <select id="dpY"></select>
    </div>
    <div class="dp-acts">
        <button class="dp-clear" onclick="clearDate()">Убрать</button>
        <button class="dp-cancel" onclick="closeDP()">Отмена</button>
        <button class="dp-ok" onclick="saveDP()">Готово</button>
    </div>
</div>

<script>
let T="",US=[],FL="all",DP_ID=null,TPLS={instruction:"",payment:"",broadcast:""},SETTINGS={autoNotificationsEnabled:false},PAGE=1,PER_PAGE=10;
const MO_FULL=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
function ini(n,id){return n?n.substring(0,2).toUpperCase():String(id).slice(-2)}

const MOCK_USERS=[
{id:1,username:"ivan_petrov",name:"Иван Петров",type:"paid",configCount:2,totalRx:5368709120,totalTx:2147483648,lastActiveAt:"2026-08-18T10:30:00Z",accessGrantedAt:"2026-01-15T12:00:00Z",paidUntil:"2026-09-15T00:00:00Z",status:"active",hasAccess:true},
{id:2,username:"anna_kozlova",name:"Анна Козлова",type:"paid",configCount:1,totalRx:1073741824,totalTx:536870912,lastActiveAt:"2026-08-17T18:45:00Z",accessGrantedAt:"2026-02-20T09:00:00Z",paidUntil:"2026-08-25T00:00:00Z",status:"expiring",hasAccess:true},
{id:3,username:"sergey_ivanov",name:"Сергей Иванов",type:"paid",configCount:3,totalRx:21474836480,totalTx:8589934592,lastActiveAt:"2026-08-18T14:20:00Z",accessGrantedAt:"2025-11-10T11:00:00Z",paidUntil:"2026-12-10T00:00:00Z",status:"active",hasAccess:true},
{id:4,username:"maria_smirnova",name:"Мария Смирнова",type:"free",configCount:0,totalRx:0,totalTx:0,lastActiveAt:null,accessGrantedAt:null,paidUntil:null,status:"unpaid",hasAccess:false},
{id:5,username:"dmitry_volkov",name:"Дмитрий Волков",type:"paid",configCount:2,totalRx:4294967296,totalTx:1073741824,lastActiveAt:"2026-08-16T09:10:00Z",accessGrantedAt:"2026-03-01T08:00:00Z",paidUntil:"2026-08-10T00:00:00Z",status:"expired",hasAccess:true},
{id:6,username:"elena_popova",name:"Елена Попова",type:"paid",configCount:1,totalRx:8589934592,totalTx:3221225472,lastActiveAt:"2026-08-18T11:05:00Z",accessGrantedAt:"2026-04-12T14:00:00Z",paidUntil:"2026-10-12T00:00:00Z",status:"active",hasAccess:true},
{id:7,username:"alex_kuznetsov",name:"Алексей Кузнецов",type:"free",configCount:1,totalRx:268435456,totalTx:134217728,lastActiveAt:"2026-08-15T16:30:00Z",accessGrantedAt:"2026-06-01T10:00:00Z",paidUntil:null,status:"unpaid",hasAccess:true},
{id:8,username:"natalya_lebedeva",name:"Наталья Лебедева",type:"paid",configCount:2,totalRx:1610612736,totalTx:805306368,lastActiveAt:"2026-08-18T08:50:00Z",accessGrantedAt:"2026-05-20T16:00:00Z",paidUntil:"2026-08-20T00:00:00Z",status:"expiring",hasAccess:true},
{id:9,username:"pavel_mikhailov",name:"Павел Михайлов",type:"paid",configCount:1,totalRx:3221225472,totalTx:1610612736,lastActiveAt:"2026-08-17T20:15:00Z",accessGrantedAt:"2026-01-05T13:00:00Z",paidUntil:"2027-01-05T00:00:00Z",status:"active",hasAccess:true},
{id:10,username:"olga_sokolova",name:"Ольга Соколова",type:"free",configCount:0,totalRx:0,totalTx:0,lastActiveAt:null,accessGrantedAt:null,paidUntil:null,status:"unpaid",hasAccess:false},
{id:11,username:"andrey_morozov",name:"Андрей Морозов",type:"paid",configCount:2,totalRx:7516192768,totalTx:2684354560,lastActiveAt:"2026-08-18T12:40:00Z",accessGrantedAt:"2026-06-15T09:00:00Z",paidUntil:"2026-09-15T00:00:00Z",status:"active",hasAccess:true},
{id:12,username:"irina_novikova",name:"Ирина Новикова",type:"paid",configCount:1,totalRx:536870912,totalTx:268435456,lastActiveAt:"2026-08-14T07:20:00Z",accessGrantedAt:"2026-03-10T11:00:00Z",paidUntil:"2026-08-05T00:00:00Z",status:"expired",hasAccess:true},
{id:13,username:"nikolay_fedorov",name:"Николай Федоров",type:"free",configCount:1,totalRx:134217728,totalTx:67108864,lastActiveAt:"2026-08-13T14:55:00Z",accessGrantedAt:"2026-07-01T08:00:00Z",paidUntil:null,status:"unpaid",hasAccess:true},
{id:14,username:"tatyana_romanova",name:"Татьяна Романова",type:"paid",configCount:1,totalRx:4294967296,totalTx:1073741824,lastActiveAt:"2026-08-18T15:00:00Z",accessGrantedAt:"2026-07-20T15:00:00Z",paidUntil:"2026-11-20T00:00:00Z",status:"active",hasAccess:true},
{id:15,username:"viktor_orlov",name:"Виктор Орлов",type:"paid",configCount:3,totalRx:12884901888,totalTx:5368709120,lastActiveAt:"2026-08-18T13:10:00Z",accessGrantedAt:"2025-12-01T10:00:00Z",paidUntil:"2026-12-01T00:00:00Z",status:"active",hasAccess:true}
];
const MOCK_TPLS={instruction:"Здравствуйте! Вот ваша инструкция по подключению к VPN.",payment:"Здравствуйте! Ваша подписка скоро истекает. Пожалуйста, продлите оплату.",expiryReminder:"Напоминание: ваша подписка истекает через 3 дня.",broadcast:"Дорогие пользователи! У нас новости."};
const MOCK_SETTINGS={autoNotificationsEnabled:false};
const MOCK_STATS={total:15,paid:11,unpaid:4};

let _useMock=false;
const _origFetch=window.fetch;
window.fetch=function(url,opts){
    if(_useMock)return _mockFetch(url,opts);
    return _origFetch(url,opts).catch(e=>{_useMock=true;return _mockFetch(url,opts)});
};
function _mockFetch(url,opts){
    return new Promise(r=>{
        setTimeout(()=>{
            const u=typeof url==="string"?url:url.url;
            const m=(opts&&opts.method)||"GET";
            if(u==="/api/stats")return r({ok:true,json:()=>Promise.resolve(MOCK_STATS)});
            if(u==="/api/users"&&m==="GET")return r({ok:true,json:()=>Promise.resolve([...MOCK_USERS])});
            if(u==="/api/templates"&&m==="GET")return r({ok:true,json:()=>Promise.resolve({...MOCK_TPLS})});
            if(u==="/api/templates"&&m==="PATCH")return r({ok:true,json:()=>Promise.resolve({ok:true})});
            if(u==="/api/settings"&&m==="GET")return r({ok:true,json:()=>Promise.resolve({...MOCK_SETTINGS})});
            if(u==="/api/settings"&&m==="PATCH")return r({ok:true,json:()=>Promise.resolve({settings:{...MOCK_SETTINGS,autoNotificationsEnabled:!MOCK_SETTINGS.autoNotificationsEnabled}})});
            if(u.match(/\/api\/notify\//))return r({ok:true,json:()=>Promise.resolve({ok:true})});
            if(u==="/api/notify/unpaid")return r({ok:true,json:()=>Promise.resolve({sent:3,total:5})});
            if(u==="/api/broadcast")return r({ok:true,json:()=>Promise.resolve({sent:12,total:15})});
            if(u.match(/\/api\/payments\//))return r({ok:true,json:()=>Promise.resolve({ok:true})});
            if(u.match(/\/api\/users\/\d+\/type/))return r({ok:true,json:()=>Promise.resolve({ok:true})});
            r({ok:true,json:()=>Promise.resolve({})});
        },50);
    });
}

function login(){
    const p=document.getElementById("lpw").value;if(p)T=p;
    document.cookie="secret="+T+";path=/;max-age=86400";
    fetch("/api/stats",{headers:{Authorization:"Bearer "+T}})
    .then(r=>{if(!r.ok)throw 0;return r.json()})
    .then(d=>{document.getElementById("lp").classList.add("hidden");document.getElementById("app").classList.remove("hidden");uS(d);lU();loadTpl();loadSettings()})
    .catch(()=>toast("Неверный пароль",1))
}
function logout(){T="";document.cookie="secret=;path=/;max-age=0";document.getElementById("app").classList.add("hidden");document.getElementById("lp").classList.remove("hidden")}
function api(p,o={}){return fetch(p,{...o,headers:{Authorization:"Bearer "+T,"Content-Type":"application/json",...o.headers}}).then(r=>r.json())}
function uS(d){document.getElementById("sT").textContent=d.total||0;document.getElementById("sP").textContent=d.paid||0;document.getElementById("sF").textContent=d.unpaid||0;document.getElementById("sNA").textContent=d.noAccess||0}
async function lU(){US=await api("/api/users");render();document.getElementById("sT").textContent=US.length;document.getElementById("sP").textContent=US.filter(u=>u.type==="paid"&&u.hasAccess).length;document.getElementById("sF").textContent=US.filter(u=>u.type==="free"&&u.hasAccess).length;document.getElementById("sNA").textContent=US.filter(u=>!u.hasAccess).length}

function filt(f){
    FL=f;PAGE=1;
    document.querySelectorAll(".stat-card").forEach(c=>c.classList.remove("active"));
    document.getElementById(f==="all"?"cAll":f==="paid"?"cPaid":f==="free"?"cFree":"cNoAccess").classList.add("active");
    fadeRender();
}

function fmtB(b){if(!b)return"0";const u=["B","KB","MB","GB","TB"];const i=Math.floor(Math.log(b)/Math.log(1024));return(b/Math.pow(1024,i)).toFixed(i>0?1:0)+" "+u[i]}
function fmtD(iso){if(!iso)return"";return new Date(iso).toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit",year:"numeric"})}
function fmtDT(iso){if(!iso)return"";return new Date(iso).toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"})}
function fmtActive(iso){
    if(!iso)return`<span style="color:var(--fg-dim)">-</span>`;
    const d=new Date(iso);const now=new Date();const diff=now.getTime()-d.getTime();
    const days=Math.floor(diff/(1000*60*60*24));
    const color=days<=7?"var(--green)":"var(--fg-dim)";
    return`<span style="color:${color};font-size:12px">${fmtDT(iso)}</span>`;
}

function buildRows(users){
    const ss=s=>{const m={paid:["Активен","badge-active"],active:["Активен","badge-active"],expiring:["Истекает","badge-expiring"],expired:["Просрочен","badge-expired"],unpaid:["Без оплаты","badge-expired"]};const[l,c]=m[s]||["-","badge-free"];return`<span class="badge ${c}">${l}</span>`};
    const tg=(t,id,acc)=>{if(!acc){const c=t==="paid"?"badge-paid":"badge-free";return`<span class="badge ${c}">${t==="paid"?"Платный":"Бесплатный"}</span>`}const c=t==="paid"?"badge-paid":"badge-free";return`<span class="badge ${c}" onclick="tType(${id},'${t}')">${t==="paid"?"Платный":"Бесплатный"}</span>`};
    return users.map(u=>{
        const nm=(u.name||"").replace(/"/g,"&quot;");
        const tr=(u.totalRx||u.totalTx)?`<span style="color:var(--green)">↓${fmtB(u.totalRx)}</span> <span style="color:var(--blue)">↑${fmtB(u.totalTx)}</span>`:`<span style="color:var(--fg-dim)">-</span>`;
        if(!u.hasAccess)return`<tr><td><div class="user-cell"><div class="avatar">${ini(u.username,u.id)}</div><div class="user-info"><div class="user-name">${u.username||"-"}</div><div class="user-id">${u.id}</div></div></div></td><td><input class="name-input" value="${nm}" placeholder="Имя" oninput="saveName(${u.id},this.value)"></td><td></td><td>0</td><td style="font-size:12px">${tr}</td><td style="font-size:12px;color:var(--fg-dim)">-</td><td style="font-size:12px;color:var(--fg-dim)">-</td><td></td><td><span class="badge badge-noaccess">Без доступа</span></td><td></td></tr>`;
        const dc=u.paidUntil?fmtD(u.paidUntil):"";
        const rg=u.accessGrantedAt?fmtD(u.accessGrantedAt):"-";
        return`<tr><td><div class="user-cell"><div class="avatar">${ini(u.username,u.id)}</div><div class="user-info"><div class="user-name">${u.username||"-"}</div><div class="user-id">${u.id}</div></div></div></td><td><input class="name-input" value="${nm}" placeholder="Имя" oninput="saveName(${u.id},this.value)"></td><td>${tg(u.type,u.id,u.hasAccess)}</td><td>${u.configCount}</td><td style="font-size:12px">${tr}</td><td style="font-size:12px">${fmtActive(u.lastActiveAt)}</td><td style="font-size:12px;color:var(--fg-dim)">${rg}</td><td><button class="date-btn${dc?"":" empty"}" onclick="openDP(event,${u.id})" data-date="${u.paidUntil||""}">${dc||"--"}</button></td><td>${ss(u.status)}</td><td><button class="icon-btn" onclick="sendNM(${u.id})"><i class="ti ti-bell"></i></button></td></tr>`;
    }).join("");
}

function render(){
    let f=US.filter(u=>{
        if(FL==="paid")return u.type==="paid"&&u.hasAccess;
        if(FL==="free")return u.type==="free"&&u.hasAccess;
        if(FL==="noaccess")return !u.hasAccess;
        return true;
    });
    const total=f.length;
    const pages=Math.ceil(total/PER_PAGE);
    if(PAGE>pages)PAGE=pages||1;
    const start=(PAGE-1)*PER_PAGE;
    const page=f.slice(start,start+PER_PAGE);

    const tb=document.getElementById("tb");
    if(!page.length){tb.innerHTML=`<tr class="empty-row"><td colspan="10">Пользователи не найдены</td></tr>`;document.getElementById("pager").innerHTML="";return}
    tb.innerHTML=buildRows(page);
    renderPager(pages,total);
}

function fadeRender(){
    const tb=document.getElementById("tb");
    tb.classList.add("fade-out");
    setTimeout(()=>{
        render();
        tb.classList.remove("fade-out");
    },120);
}

function renderPager(pages,total){
    const el=document.getElementById("pager");
    if(pages<=1){el.innerHTML="";return}
    let h=`<button ${PAGE===1?"disabled":""} onclick="goPage(${PAGE-1})">←</button>`;
    for(let i=1;i<=pages;i++){
        if(pages>7&&i>2&&i<pages-1&&Math.abs(i-PAGE)>1){
            if(i===3||i===pages-2)h+=`<span style="color:var(--fg-dim);font-size:12px;padding:0 2px">…</span>`;
            continue;
        }
        h+=`<button class="${i===PAGE?"active":""}" onclick="goPage(${i})">${i}</button>`;
    }
    h+=`<button ${PAGE===pages?"disabled":""} onclick="goPage(${PAGE+1})">→</button>`;
    h+=`<span class="pg-info">${(PAGE-1)*PER_PAGE+1}–${Math.min(PAGE*PER_PAGE,total)} из ${total}</span>`;
    el.innerHTML=h;
}
function goPage(n){PAGE=n;fadeRender()}

async function sendNM(id){
    const msg=TPLS.payment;
    if(!msg){toast("Шаблон уведомления пуст",1);return}
    await api("/api/notify/"+id,{method:"POST",body:JSON.stringify({message:msg})});
    toast("Отправлено",0)
}
function openDP(e,id){
    e.stopPropagation();DP_ID=id;
    const btn=e.currentTarget;const ds=btn.dataset.date;
    const d=ds?new Date(ds):new Date();
    if(!ds)d.setMonth(d.getMonth()+1);
    const dd=d.getDate(),mm=d.getMonth(),yy=d.getFullYear();
    const sD=document.getElementById("dpD"),sM=document.getElementById("dpM"),sY=document.getElementById("dpY");
    sD.innerHTML="";sM.innerHTML="";sY.innerHTML="";
    for(let i=1;i<=31;i++)sD.innerHTML+=`<option value="${i}"${i===dd?" selected":""}>${i}</option>`;
    for(let i=0;i<12;i++)sM.innerHTML+=`<option value="${i}"${i===mm?" selected":""}>${MO_FULL[i]}</option>`;
    for(let i=2024;i<=2030;i++)sY.innerHTML+=`<option value="${i}"${i===yy?" selected":""}>${i}</option>`;
    const pop=document.getElementById("dp");
    const r=btn.getBoundingClientRect();
    pop.style.left=Math.min(r.left,window.innerWidth-280)+"px";
    pop.style.top=(r.bottom+6)+"px";
    pop.classList.add("on");
    setTimeout(()=>document.addEventListener("click",dpOutside),10);
}
function dpOutside(e){if(!document.getElementById("dp").contains(e.target))closeDP()}
function closeDP(){document.getElementById("dp").classList.remove("on");document.removeEventListener("click",dpOutside)}
async function saveDP(){
    const d=+document.getElementById("dpD").value,m=+document.getElementById("dpM").value,y=+document.getElementById("dpY").value;
    const iso=new Date(y,m,d).toISOString();
    await api("/api/payments/"+DP_ID,{method:"PATCH",body:JSON.stringify({paidUntil:iso})});
    closeDP();toast("Дата обновлена",0);lU()
}
async function clearDate(){
    await api("/api/payments/"+DP_ID,{method:"PATCH",body:JSON.stringify({paidUntil:""})});
    closeDP();toast("Дата убрана",0);lU()
}
let _nt=null;
function saveName(id,val){
    const u=US.find(u=>u.id===id);if(u)u.name=val;
    clearTimeout(_nt);
    _nt=setTimeout(()=>api("/api/payments/"+id,{method:"PATCH",body:JSON.stringify({name:val})}),500);
}
async function tType(id,cur){
    const n=cur==="paid"?"free":"paid";
    await api("/api/users/"+id+"/type",{method:"POST",body:JSON.stringify({type:n})});
    const u=US.find(u=>u.id===id);if(u)u.type=n;
    document.getElementById("sP").textContent=US.filter(u=>u.type==="paid"&&u.hasAccess).length;
    document.getElementById("sF").textContent=US.filter(u=>u.type==="free"&&u.hasAccess).length;
    fadeRender();
    toast(n==="paid"?"Платный":"Бесплатный",0);
}
async function notifyAll(){
    const msg=TPLS.payment;
    if(!msg){toast("Шаблон уведомления пуст",1);return}
    if(!confirm("Отправить уведомление просроченным платным пользователям?"))return;
    const r=await api("/api/notify/unpaid",{method:"POST",body:JSON.stringify({message:msg})});
    toast("Отправлено "+r.sent+" из "+r.total,0)
}
async function sendBroadcast(){
    const m=TPLS.broadcast;
    if(!m||!m.trim()){toast("Шаблон рассылки пуст",1);return}
    if(!confirm("Отправить рассылку всем пользователям?"))return;
    const r=await api("/api/broadcast",{method:"POST",body:JSON.stringify({message:m})});
    toast("Рассылка: "+r.sent+" из "+r.total,0)
}
function showTpl(){
    document.getElementById("app").classList.add("hidden");document.getElementById("tp").classList.remove("hidden");
    document.getElementById("topbar").style.display="none";
    document.getElementById("tInst").value=TPLS.instruction||"";document.getElementById("tPay").value=TPLS.payment||"";
    document.getElementById("tExpRem").value=TPLS.expiryReminder||"";document.getElementById("tBc").value=TPLS.broadcast||"";
}
function showMain(){
    document.getElementById("tp").classList.add("hidden");document.getElementById("app").classList.remove("hidden");
    document.getElementById("topbar").style.display="";
}
async function loadTpl(){TPLS=await api("/api/templates")}
async function loadSettings(){SETTINGS=await api("/api/settings");if(SETTINGS.settings)SETTINGS=SETTINGS.settings;updateToggleUI()}
function updateToggleUI(){
    const w=document.getElementById("autoToggle"),l=document.getElementById("autoLabel");
    if(!w||!l)return;
    if(SETTINGS.autoNotificationsEnabled){w.classList.add("on")}else{w.classList.remove("on")};
    l.textContent=SETTINGS.autoNotificationsEnabled?"Автоотправка: ВКЛ":"Автоотправка: ВЫКЛ";
}
async function toggleAuto(){
    SETTINGS=await api("/api/settings",{method:"PATCH",body:JSON.stringify({autoNotificationsEnabled:!SETTINGS.autoNotificationsEnabled})});
    if(SETTINGS.settings)SETTINGS=SETTINGS.settings;updateToggleUI();
    toast(SETTINGS.autoNotificationsEnabled?"Авто-уведомления включены":"Авто-уведомления выключены",0);
}
async function saveTpl(){
    const data={instruction:document.getElementById("tInst").value,payment:document.getElementById("tPay").value,expiryReminder:document.getElementById("tExpRem").value,broadcast:document.getElementById("tBc").value};
    await api("/api/templates",{method:"PATCH",body:JSON.stringify(data)});TPLS=data;toast("Сохранено",0);
}
function toast(msg,err){
    const t=document.createElement("div");t.className="toast "+(err?"err":"ok");t.textContent=msg;
    document.body.appendChild(t);setTimeout(()=>t.remove(),2500)
}

document.addEventListener("DOMContentLoaded",()=>{const c=document.cookie.match(/secret=([^;]+)/);if(c){T=c[1];login()}});
</script>
